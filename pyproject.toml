[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-vuldris"
version = "0.1.0"
description = "Open-source, self-hosted security assurance for AI model endpoints"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
keywords = [
    "ai-security",
    "llm-security",
    "model-security",
    "prompt-injection",
    "jailbreak",
    "red-teaming",
    "owasp-llm-top-10",
    "security-testing",
    "self-hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
authors = [
    { name = "Aegis Vuldris Contributors" }
]
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "cryptography>=49,<51",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "httpx2>=2.13,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.9,<3",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/xizoai/Aegis-Vuldris"
Repository = "https://github.com/xizoai/Aegis-Vuldris"
Issues = "https://github.com/xizoai/Aegis-Vuldris/issues"
Changelog = "https://github.com/xizoai/Aegis-Vuldris/blob/main/CHANGELOG.md"
Documentation = "https://github.com/xizoai/Aegis-Vuldris/tree/main/docs"

[project.scripts]
# The single CLI entry point. `aegis` wraps the service layer and the
# existing `python -m app.cli.*` modules; see backend/app/cli/main.py.
aegis = "app.cli.main:main"

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "httpx2>=2.13,<3",
    "pre-commit>=4.6,<5",
    "pyright>=1.1.413,<2",
    "pytest>=9.1,<10",
    "ruff>=0.16.6,<1",
]

[tool.setuptools.packages.find]
where = ["backend"]
# Explicit include list. Without it, setuptools' auto-discovery silently drops
# packages it considers ambiguous and never ships non-Python data files, which
# would leave app/cli out of the wheel and the bundled YAML attack library
# out of the image entirely.
include = ["app*"]

[tool.setuptools.package-data]
# The attack library and the offline demo fixture are static data shipped
# inside the package, so `python -m app.cli.seed_tests` and `aegis demo` can
# find them from an installed wheel.
"app" = [
    "test_cases/**/*.yaml",
    "test_cases/**/*.yml",
    "test_cases/**/*.json",
    "fixtures/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers"
]
markers = [
    "slow: builds artifacts or needs the network; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"scripts/generate_test_cases.py" = ["E501"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["backend", "tests"]
exclude = [
    "**/__pycache__",
    ".venv"
]
venvPath = "."
venv = ".venv"
extraPaths = ["backend"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
