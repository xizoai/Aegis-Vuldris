version: 2
updates:
  # Python dependencies (pyproject.toml / uv.lock at the repository root).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # Frontend dependencies.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps-frontend)"

  # GitHub Actions workflow versions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(actions)"

  # Container base images referenced by the backend and frontend Dockerfiles.
  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
  - package-ecosystem: docker
    directory: "/frontend"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
