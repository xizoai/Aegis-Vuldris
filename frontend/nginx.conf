# Aegis Vuldris frontend nginx configuration.
#
# Serves the built single-page app and proxies /api to the backend on the
# internal network. The browser therefore only ever talks to one origin, so no
# CORS policy or cross-origin credential handling is required.

upstream aegis_backend {
    server backend:8000;
    keepalive 16;
}

server {
    # Unprivileged port so the container needs no CAP_NET_BIND_SERVICE.
    listen 8080;
    listen [::]:8080;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Generated report artifacts can be large; keep the limit generous but
    # bounded so a single request cannot exhaust container memory.
    client_max_body_size 25m;

    # Do not advertise the server implementation.
    server_tokens off;

    # Baseline hardening. CSP is intentionally not set here because the Vite
    # bundle and inline styles need tuning per environment; add it once the
    # deployed asset set is known.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss image/svg+xml;

    # Container-internal access log. Access logs record method, path and status
    # only; request bodies, headers and credentials are never logged.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ------------------------------------------------------------------ API
    location /api/ {
        proxy_pass         http://aegis_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # Model assessments can run long; execution is asynchronous but the
        # report generation and download paths may still take a while.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Responses must never be cached: they are authenticated and may carry
        # evidence.
        proxy_buffering off;
    }

    # ---------------------------------------------------------------- assets
    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients pin to a stale app shell that
    # references deleted asset hashes after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ------------------------------------------------------- SPA fallback
    # Client-side routing means unknown paths must return the app shell rather
    # than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
